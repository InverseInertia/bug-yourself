# Copy to ~/.config/bug-yourself/analyzer.toml and adjust the paths.

# Folders you move keepers into; the review app's Kept page shows them.
# Must stay above the [detect] section (TOML puts later keys inside a section).
kept_dirs = ["~/Music/keepers"]

# SSD folder the receiver writes into (receiver --dir).
working_dir = "~/bug-yourself/recordings"

# HDD folder holding everything long-term. The analyzer refuses to run unless
# it contains a file named .bug-yourself-archive (create it once with touch),
# so an unmounted drive is never mistaken for an empty one.
# Inside it: unanalyzed/ (receiver --unanalyzed-dir), archive/, samples/, analyzer.db
hdd_root = "/run/media/system/<label>/bug-yourself"

# SSD folder for each night's new clips; moved into <hdd_root>/samples the next night.
samples_new_dir = "~/bug-yourself/samples-new"

# Oldest chunks / clips are deleted once these are exceeded.
archive_max = "500GB"
samples_max = "100GB"

[detect]
# How many clips to cut per hour of recording, per kind, and the minimum score
# (0-1) a moment needs to become a clip. Everything detected is kept in the
# database either way (analyzer.py list --all), so these can be changed later.
quota_per_hour = { percussive = 6, tonal = 4, loop = 2, texture = 2 }
min_score = { percussive = 0.75, tonal = 0.6, loop = 0.6, texture = 0.6 }

[ai]
# Tags (what a sound is) and search vectors (find sounds by describing them).
# Needs server/install.sh --with-ai; without it, moments are simply untagged.
# device: "auto" uses the GPU when at least 2.5 GB of its memory is free (so a
# running game isn't disturbed), else the CPU; or force "cuda" / "cpu".
enabled = true
device = "auto"
